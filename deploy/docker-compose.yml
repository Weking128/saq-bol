# Сақ бол! на своём сервере (VPS в Казахстане): сайт + база MongoDB + HTTPS + ежедневные бэкапы.
# Запуск: cd deploy && docker compose up -d --build
# Подробная инструкция — в README, раздел «Размещение на сервере в Казахстане».
name: saq-bol

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"   # логи не разрастутся и не забьют диск
    max-file: "5"

services:
  # HTTPS (сертификат Let's Encrypt выпускается и продлевается сам), раздача страниц, прокси к API
  caddy:
    # Файлы сайта — внутри образа, заранее сжатые (см. caddy.Dockerfile)
    build:
      context: ..
      dockerfile: deploy/caddy.Dockerfile
    image: saq-bol-caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?укажите SITE_DOMAIN в deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    logging: *logging

  # API квеста (несколько процессов Node, см. server.js)
  app:
    build: ..
    image: saq-bol-app
    restart: unless-stopped
    init: true
    # Защита на случай взлома приложения: файлы образа только для чтения, без прав
    # администратора внутри контейнера и без повышения прав
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      MONGODB_URI: mongodb://saqbol:${MONGO_APP_PASSWORD}@mongo:27017/saq-bol?authSource=saq-bol
      MONGODB_DB: saq-bol
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?укажите ADMIN_PASSWORD в deploy/.env}
      TRUST_PROXY: "1"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-}
      MONGODB_POOL_SIZE: ${MONGODB_POOL_SIZE:-20}
    depends_on:
      mongo:
        condition: service_healthy
    logging: *logging

  # База данных. Наружу не открыта — доступна только приложению и бэкапу внутри сервера.
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-1}"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?укажите MONGO_ROOT_PASSWORD в deploy/.env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?укажите MONGO_APP_PASSWORD в deploy/.env}
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *logging

  # Ежедневная копия базы в deploy/backups (хранится BACKUP_KEEP_DAYS дней)
  backup:
    image: mongo:8.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    entrypoint: ["bash", "/backup.sh"]
    environment:
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      TZ: "<+05>-5"   # время Казахстана (UTC+5)
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      mongo:
        condition: service_healthy
    logging: *logging

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
